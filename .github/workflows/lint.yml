---
name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    uses: DevSecNinja/.github/.github/workflows/lint.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.10.24"
      # Standard lint config files are synced to the repo root by config-sync.
      lint-config-dir: "."
      # Optional: fail this workflow when a linter fails (default: false).
      # lint-fail-on-error: true
