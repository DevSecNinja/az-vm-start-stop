---
name: Release Artifact

# When release-please publishes a GitHub Release, build the function deployment
# package (dotnet publish zip) for that tag and attach it as a release asset,
# giving versioned, downloadable artifacts for manual deploy/rollback.

on:
  release:
    types:
      - published

permissions: {}

env:
  FUNCTIONS_PROJECT: src/AzVmStartStop.Functions

jobs:
  attach-package:
    name: Attach function package
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload the package to the release.
      id-token: write # Mint the OIDC token for the Sigstore signing certificate.
      attestations: write # Store the build-provenance attestation for this repo.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # renovate: datasource=dotnet-version depName=dotnet-sdk
          dotnet-version: "8.0.428"

      - name: Publish and package
        env:
          TAG: ${{ github.event.release.tag_name }}
          REVISION: ${{ github.sha }}
        run: |
          dotnet publish "${FUNCTIONS_PROJECT}" -c Release -o ./publish -p:SourceRevisionId="${REVISION}"
          (cd publish && zip -r "../azvmstartstop-${TAG}.zip" .)

      # Signed build provenance for the package, verifiable after download with:
      #   gh attestation verify azvmstartstop-vX.Y.Z.zip --repo DevSecNinja/az-vm-start-stop
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: azvmstartstop-${{ github.event.release.tag_name }}.zip

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" "azvmstartstop-${TAG}.zip" --clobber
